<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_cryptography-secure-protocols" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180B0B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_cryptography-secure-protocols" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E06A6A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E06A6A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_cryptography-secure-protocols" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_cryptography-secure-protocols" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_cryptography-secure-protocols)" />
  <rect width="600" height="450" fill="url(#grid_cryptography-secure-protocols)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_cryptography-secure-protocols)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#E06A6A" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_cryptography-secure-protocols)">
    
      <path d="M300 150 L380 185 V260 C380 310 300 345 300 345 C300 345 220 310 220 260 V185 Z" fill="#1E293B" stroke="#E06A6A" stroke-width="4"/>
      <rect x="275" y="225" width="50" height="40" rx="6" fill="#E06A6A"/>
      <path d="M285 225 V210 C285 200 315 200 315 210 V225" fill="none" stroke="#FCA5A5" stroke-width="4" stroke-linecap="round"/>
      <circle cx="300" cy="242" r="4" fill="#0B1120"/>
      <line x1="300" y1="246" x2="300" y2="255" stroke="#0B1120" stroke-width="3"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#E06A6A" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">INTERMEDIATE</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#E06A6A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CYBER SECURITY</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // cryptography-secure-protocols</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">24 Lessons • 20m / lesson</text>
</svg>