<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_linux-shell-scripting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180B0B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_linux-shell-scripting" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E06A6A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E06A6A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_linux-shell-scripting" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_linux-shell-scripting" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_linux-shell-scripting)" />
  <rect width="600" height="450" fill="url(#grid_linux-shell-scripting)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_linux-shell-scripting)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#E06A6A" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_linux-shell-scripting)">
    
      <rect x="180" y="160" width="240" height="150" rx="8" fill="#1E293B" stroke="#E06A6A" stroke-width="3"/>
      <rect x="180" y="160" width="240" height="30" rx="8" fill="rgba(255,255,255,0.08)"/>
      <circle cx="200" cy="175" r="4" fill="#EF4444"/>
      <circle cx="215" cy="175" r="4" fill="#F59E0B"/>
      <circle cx="230" cy="175" r="4" fill="#10B981"/>
      <text x="250" y="180" fill="#94A3B8" font-family="monospace" font-size="12">kernel-v6.8 // bash</text>
      <text x="200" y="220" fill="#FCA5A5" font-family="monospace" font-size="13">$ sudo systemctl status core</text>
      <text x="200" y="245" fill="#10B981" font-family="monospace" font-size="13">● Active: running (pid 1420)</text>
      <text x="200" y="270" fill="#94A3B8" font-family="monospace" font-size="13">  Memory: 48.2MB / 4.0GB</text>
      <rect x="200" y="285" width="200" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
      <rect x="200" y="285" width="80" height="6" rx="3" fill="#E06A6A"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#E06A6A" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">BEGINNER</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#E06A6A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#FCA5A5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CYBER SECURITY</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // linux-shell-scripting</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">25 Lessons • 20m / lesson</text>
</svg>