<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_software-development-devops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_software-development-devops" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_software-development-devops" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_software-development-devops" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_software-development-devops)" />
  <rect width="600" height="450" fill="url(#grid_software-development-devops)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_software-development-devops)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_software-development-devops)">
    
    <rect x="190" y="160" width="220" height="150" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
    <rect x="190" y="160" width="220" height="28" rx="10" fill="rgba(255,255,255,0.06)"/>
    <circle cx="208" cy="174" r="4" fill="#EF4444"/>
    <circle cx="222" cy="174" r="4" fill="#F59E0B"/>
    <circle cx="236" cy="174" r="4" fill="#10B981"/>
    <line x1="210" y1="210" x2="280" y2="210" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="210" y1="235" x2="340" y2="235" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="230" y1="260" x2="310" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    <line x1="210" y1="285" x2="260" y2="285" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#3B82F6" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">INTERMEDIATE</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#93C5FD" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CSE CORE</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // software-development-devops</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">28 Lessons • 22m / lesson</text>
</svg>