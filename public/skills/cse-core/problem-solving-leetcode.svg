<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_problem-solving-leetcode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_problem-solving-leetcode" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_problem-solving-leetcode" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_problem-solving-leetcode" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_problem-solving-leetcode)" />
  <rect width="600" height="450" fill="url(#grid_problem-solving-leetcode)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_problem-solving-leetcode)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_problem-solving-leetcode)">
    
      <line x1="300" y1="160" x2="220" y2="230" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="300" y1="160" x2="380" y2="230" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2"/>
      <line x1="220" y1="230" x2="180" y2="300" stroke="#3B82F6" stroke-width="2"/>
      <line x1="220" y1="230" x2="260" y2="300" stroke="#3B82F6" stroke-width="2"/>
      <line x1="380" y1="230" x2="340" y2="300" stroke="#3B82F6" stroke-width="2"/>
      <line x1="380" y1="230" x2="420" y2="300" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="300" cy="160" r="22" fill="#1E293B" stroke="#3B82F6" stroke-width="4"/>
      <text x="300" y="165" fill="#93C5FD" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">root</text>
      <circle cx="220" cy="230" r="18" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
      <circle cx="380" cy="230" r="18" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
      <circle cx="180" cy="300" r="15" fill="#1E293B" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="260" cy="300" r="15" fill="#1E293B" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="340" cy="300" r="15" fill="#1E293B" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="420" cy="300" r="15" fill="#1E293B" stroke="#93C5FD" stroke-width="2"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#3B82F6" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">INTERMEDIATE</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#93C5FD" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">CSE CORE</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // problem-solving-leetcode</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">35 Lessons • 25m / lesson</text>
</svg>