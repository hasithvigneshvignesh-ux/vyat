<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_data-engineering-modern-sql" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181205" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_data-engineering-modern-sql" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D9A81E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D9A81E" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_data-engineering-modern-sql" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_data-engineering-modern-sql" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_data-engineering-modern-sql)" />
  <rect width="600" height="450" fill="url(#grid_data-engineering-modern-sql)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_data-engineering-modern-sql)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#D9A81E" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_data-engineering-modern-sql)">
    
      <ellipse cx="300" cy="170" rx="90" ry="26" fill="#1E293B" stroke="#D9A81E" stroke-width="3"/>
      <path d="M210 170 v40 c0 14 40 26 90 26 s90 -12 90 -26 v-40" fill="#1E293B" stroke="#D9A81E" stroke-width="3"/>
      <path d="M210 210 v40 c0 14 40 26 90 26 s90 -12 90 -26 v-40" fill="#1E293B" stroke="#D9A81E" stroke-width="3"/>
      <path d="M210 250 v40 c0 14 40 26 90 26 s90 -12 90 -26 v-40" fill="#1E293B" stroke="#D9A81E" stroke-width="3"/>
      <line x1="240" y1="170" x2="360" y2="170" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
      <line x1="240" y1="210" x2="320" y2="210" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
      <line x1="240" y1="250" x2="340" y2="250" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="360" cy="285" r="7" fill="#D9A81E"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#D9A81E" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ADVANCED</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#D9A81E" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">DATA SCIENCE</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // data-engineering-modern-sql</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">30 Lessons • 22m / lesson</text>
</svg>