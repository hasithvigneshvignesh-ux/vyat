<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_advanced-analytics-timeseries" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181205" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_advanced-analytics-timeseries" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D9A81E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D9A81E" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_advanced-analytics-timeseries" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_advanced-analytics-timeseries" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_advanced-analytics-timeseries)" />
  <rect width="600" height="450" fill="url(#grid_advanced-analytics-timeseries)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_advanced-analytics-timeseries)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#D9A81E" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_advanced-analytics-timeseries)">
    
      <line x1="190" y1="320" x2="410" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <line x1="190" y1="160" x2="190" y2="320" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <rect x="215" y="240" width="28" height="80" rx="4" fill="#D9A81E" opacity="0.85"/>
      <rect x="255" y="200" width="28" height="120" rx="4" fill="#D9A81E" opacity="0.9"/>
      <rect x="295" y="170" width="28" height="150" rx="4" fill="#FDE68A"/>
      <rect x="335" y="210" width="28" height="110" rx="4" fill="#D9A81E" opacity="0.85"/>
      <rect x="375" y="180" width="28" height="140" rx="4" fill="#D9A81E" opacity="0.95"/>
      <path d="M215 250 Q270 170 310 160 T400 175" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="310" cy="160" r="5" fill="#F59E0B"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#D9A81E" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ADVANCED</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#D9A81E" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#FDE68A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">DATA SCIENCE</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // advanced-analytics-timeseries</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">28 Lessons • 22m / lesson</text>
</svg>