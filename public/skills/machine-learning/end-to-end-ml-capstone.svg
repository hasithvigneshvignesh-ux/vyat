<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_end-to-end-ml-capstone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0B1E" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <radialGradient id="glow_end-to-end-ml-capstone" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7C5CD6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C5CD6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_end-to-end-ml-capstone" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow_end-to-end-ml-capstone" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bg_end-to-end-ml-capstone)" />
  <rect width="600" height="450" fill="url(#grid_end-to-end-ml-capstone)" />
  <circle cx="300" cy="225" r="180" fill="url(#glow_end-to-end-ml-capstone)" />

  <!-- Outer frame border with subtle brand glow -->
  <rect x="1.5" y="1.5" width="597" height="447" rx="18.5" stroke="#7C5CD6" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Graphic Subject -->
  <g filter="url(#dropShadow_end-to-end-ml-capstone)">
    
      <circle cx="200" cy="180" r="14" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="200" cy="230" r="14" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="200" cy="280" r="14" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="200" cy="330" r="14" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="300" cy="160" r="16" fill="#1E293B" stroke="#C4B5FD" stroke-width="3"/>
      <circle cx="300" cy="215" r="16" fill="#1E293B" stroke="#C4B5FD" stroke-width="3"/>
      <circle cx="300" cy="270" r="16" fill="#1E293B" stroke="#C4B5FD" stroke-width="3"/>
      <circle cx="300" cy="325" r="16" fill="#1E293B" stroke="#C4B5FD" stroke-width="3"/>
      <circle cx="400" cy="200" r="15" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="400" cy="260" r="15" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <circle cx="400" cy="320" r="15" fill="#1E293B" stroke="#7C5CD6" stroke-width="3"/>
      <line x1="214" y1="180" x2="284" y2="160" stroke="#7C5CD6" stroke-width="1.5" opacity="0.7"/>
      <line x1="214" y1="180" x2="284" y2="215" stroke="#7C5CD6" stroke-width="1.5" opacity="0.7"/>
      <line x1="214" y1="230" x2="284" y2="215" stroke="#7C5CD6" stroke-width="1.5" opacity="0.7"/>
      <line x1="214" y1="280" x2="284" y2="270" stroke="#7C5CD6" stroke-width="1.5" opacity="0.7"/>
      <line x1="214" y1="330" x2="284" y2="325" stroke="#7C5CD6" stroke-width="1.5" opacity="0.7"/>
      <line x1="316" y1="215" x2="385" y2="200" stroke="#C4B5FD" stroke-width="1.5" opacity="0.8"/>
      <line x1="316" y1="270" x2="385" y2="260" stroke="#C4B5FD" stroke-width="1.5" opacity="0.8"/>
      <line x1="316" y1="325" x2="385" y2="320" stroke="#C4B5FD" stroke-width="1.5" opacity="0.8"/>
    
  </g>

  <!-- Level & Lessons Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="46" cy="46" r="4" fill="#7C5CD6" />
  <text x="58" y="51" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ADVANCED</text>

  <!-- Branch Pill -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#7C5CD6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="495" y="51" fill="#C4B5FD" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">MACHINE LEARNING</text>

  <!-- Bottom Brand Watermark -->
  <text x="30" y="415" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">VYAT // end-to-end-ml-capstone</text>
  <text x="570" y="415" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="end">30 Lessons • 25m / lesson</text>
</svg>